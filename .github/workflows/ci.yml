name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Keep only the newest run for each branch. A newer main push cancels the
  # superseded validation run. Production is managed by the Windows controller.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Hosting cache regression tests
        run: node --test hosting/helpers.node-test.cjs hosting/cache.node-test.cjs
      - run: npm ci --prefer-offline
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
